# HTTP server - only used for Let's Encrypt validation and redirect to HTTPS
server {
    listen 80;
    server_name ec2-65-2-142-83.ap-south-1.compute.amazonaws.com;

    # Allow Let's Encrypt verification challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all other HTTP requests to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS server - secure traffic
server {
    listen 443 ssl;
    server_name ec2-65-2-142-83.ap-south-1.compute.amazonaws.com;

    # --- SSL Certificates ---
    # For testing (self-signed certificate):
    ssl_certificate /etc/ssl/certs/selfsigned.crt;
    ssl_certificate_key /etc/ssl/private/selfsigned.key;

    # For production Certbot-managed certificates (comment the above and uncomment below):
    # ssl_certificate /etc/letsencrypt/live/ec2-65-2-142-83.ap-south-1.compute.amazonaws.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/ec2-65-2-142-83.ap-south-1.compute.amazonaws.com/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # --- Next.js frontend ---
    location / {
        proxy_pass http://rag-admin-frontend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- FastAPI backend ---
    location /api/ {
        proxy_pass http://fastapi-backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
